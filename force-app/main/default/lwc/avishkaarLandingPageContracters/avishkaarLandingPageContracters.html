						<div class="event-cards-container">
							<template for:each={holidayArray} for:item="holiday">
								<div key={holiday.Id}>
									<div class="event event-card">
										<div class="event-card-details slds-p-left_medium ">
											<div class="event-title slds-text-heading_small slds-m-bottom_xx-small">
												{holiday.Name}</div>
											<div class="event-location slds-text-title"

												( Restricted Holiday )
											</div>
											<div class="event-location slds-text-title"

											</div>
										</div>
										<div class="event-card-date">
											<div class="event-start">

														day="2-digit"></lightning-formatted-date-time>
												</div>
												<div class="event-start-month  slds-m-bottom_xx-small">
													<lightning-formatted-date-time value={holiday.Date__c}
														weekday="long"></lightning-formatted-date-time>
												</div>
											</div>
										</div>
									</div>

							</template>
						</div>
