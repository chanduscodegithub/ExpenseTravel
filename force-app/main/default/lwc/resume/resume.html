<template>
<div if:true={showAskQuestion}>
<c-resume-user-prompt record-id={recordId} insight-record={resumeInsightRecord} onclose={handleCloseAskQuestion}></c-resume-user-prompt>
</div>
<div class="container">
<template if:true={resumeInsightRecord}>
<div class="card1">
<div class="header">
  <div class="name">{data.Name}</div>
  <div class="domain">
    {data.LatestRole}
    <span class="summarybtn">
      <button class="custom-button" onclick={showPopup}>
        Summary
      </button>
      </span>
      
  </div>
  <div class="askQuestion">
    <a onclick={handleAskQuestion}>Copilot</a>
  </div>
    <div class="custom-backdrop" if:true={showModal}></div>
  <template if:true={showModal}>
    <div class="custom-modal">
      <div class="headingContent slds-text-align_left">
        <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 448 512">
          <path d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H288V368c0-26.5 21.5-48 48-48H448V96c0-35.3-28.7-64-64-64H64zM448 352H402.7 336c-8.8 0-16 7.2-16 16v66.7V480l32-32 64-64 32-32z" />
        </svg>
        Resume Summary <span class="fontWeight300">| {data.Name} </span>
      </div>
      <hr />
      <div class="custom-modal-content">
        <div>{accountSummary}</div>
      </div>
      <footer class="custom-modal-footer">
        <button class="custom-close-button" onclick={closeModal}>
          Close
        </button>
      </footer>
    </div>
  </template>
  
</div>
<div class="user-info">
  <div class="detail">
    <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
      <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z" />
    </svg>
      <template if:true={data.Email}>
    <lightning-formatted-email class="lightningemail" value={resumeInsightRecord.Email_Address__c} hide-icon></lightning-formatted-email>
      </template>
      <template if:false={data.Email}>
      <span class="notprovided">Not Provided</span>
    </template>
  </div>
  <div class="detail">
    <lightning-icon class="custom-icon" icon-name="utility:call" alternative-text="Phone" title="Phone" size="x-small" variant="bare"></lightning-icon>
    <span class="content">{data.Phone}</span>
  </div>
  <div class="detail">
    <lightning-icon class="custom-icon" icon-name="utility:checkin" alternative-text="Location" title="Location" size="x-small" variant="bare"></lightning-icon>
    <template if:true={data.Location}>
      <span class="content">{data.Location}</span>
    </template>
    <template if:false={data.Location}>
      <span class="notprovided">Not Provided</span>
    </template>
  </div>
  <div class="detail">
    <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 448 512">
      <path d="M416 32H31.9C14.3 32 0 46.5 0 64.3v383.4C0 465.5 14.3 480 31.9 480H416c17.6 0 32-14.5 32-32.3V64.3c0-17.8-14.4-32.3-32-32.3zM135.4 416H69V202.2h66.5V416zm-33.2-243c-21.3 0-38.5-17.3-38.5-38.5S80.9 96 102.2 96c21.2 0 38.5 17.3 38.5 38.5 0 21.3-17.2 38.5-38.5 38.5zm282.1 243h-66.4V312c0-24.8-.5-56.7-34.5-56.7-34.6 0-39.9 27-39.9 54.9V416h-66.4V202.2h63.7v29.2h.9c8.9-16.8 30.6-34.5 62.9-34.5 67.2 0 79.7 44.3 79.7 101.9V416z" />
    </svg>
    <template if:true={data.LinkedIn}>
      <a class="linkedin" href={data.LinkedIn} target="_blank">Candidate LinkedIn</a>
    </template>
    <template if:false={data.LinkedIn}>
      <span class="notprovided">Not Provided</span>
    </template>
  </div>
  <div class="detail">
    <lightning-icon class="custom-icon" icon-name="utility:trailhead_alt" alternative-text="Trailhead" title="Trailhead" size="x-small" variant="bare"></lightning-icon>
    <template if:true={data.Trailhead}>
      <a class="trail" href={data.Trailhead} target="_blank">Candidate Trailblazer</a>
    </template>
    <template if:false={data.Trailhead}>
      <span class="notprovided">Not Provided</span>
    </template>
  </div>
</div>
<hr />
<div class="lastCard">
  <div class="detail">
    <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
      <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z" />
    </svg>

    <span class="subheading"> Worked in {rrfLocation} before ?</span>
    <template if:true={data.workedInBangalore}>
      <span class="content">{data.workedInBangalore}</span>
    </template>
    <template if:false={data.workedInBangalore}>
      <span class="notprovided">Not Provided</span>
    </template>
  </div>
  <div class="detail">
    <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
      <path d="M184 48H328c4.4 0 8 3.6 8 8V96H176V56c0-4.4 3.6-8 8-8zm-56 8V96H64C28.7 96 0 124.7 0 160v96H192 352h8.2c32.3-39.1 81.1-64 135.8-64c5.4 0 10.7 .2 16 .7V160c0-35.3-28.7-64-64-64H384V56c0-30.9-25.1-56-56-56H184c-30.9 0-56 25.1-56 56zM320 352H224c-17.7 0-32-14.3-32-32V288H0V416c0 35.3 28.7 64 64 64H360.2C335.1 449.6 320 410.5 320 368c0-5.4 .2-10.7 .7-16l-.7 0zm320 16a144 144 0 1 0 -288 0 144 144 0 1 0 288 0zM496 288c8.8 0 16 7.2 16 16v48h32c8.8 0 16 7.2 16 16s-7.2 16-16 16H496c-8.8 0-16-7.2-16-16V304c0-8.8 7.2-16 16-16z" />
    </svg>
    <span class="subheading"> Expecting Hybrid Work model ? </span>
    <template if:true={data.hybridModel}>
      <span class="content">{data.hybridModel}</span>
    </template>
    <template if:false={data.hybridModel}>
      <span class="notprovided">Not Provided</span>
    </template>
  </div>
</div>
</div>
<div class="card2">
<div class="headingContent slds-text-align_left">
  <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
    <path d="M0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm320 96c0-26.9-16.5-49.9-40-59.3V88c0-13.3-10.7-24-24-24s-24 10.7-24 24V292.7c-23.5 9.5-40 32.5-40 59.3c0 35.3 28.7 64 64 64s64-28.7 64-64zM144 176a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm-16 80a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm288 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64zM400 144a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z" />
  </svg>
  Experience Summary
</div>
<div class="experiencecontainer">
  <div class="experiencedetail">
    <span class="experienceheading">Total Work Experience </span>
    <div>
      <!-- <span class={totalWorkExpClass}>{data.performanceIndicator.totalWorkExp}</span>&nbsp;Months -->
      <span if:true={data.performanceIndicator.totalWorkExpInYears.year}>
        <span class={totalWorkExpClass}>{data.performanceIndicator.totalWorkExpInYears.year}</span>Y&nbsp;
      </span>
      <span if:true={data.performanceIndicator.totalWorkExpInYears.month}>
        <span class={totalWorkExpClass}>{data.performanceIndicator.totalWorkExpInYears.month}</span>M
      </span>
    </div>
  </div>
  <div class="experiencedetail">
    <span class="experienceheading">Min/Max Tenure in a Company</span>
    <!-- <div><span class={minTenureClass}>{data.performanceIndicator.minTenure}</span>&nbsp;/&nbsp;<span class={maxTenureClass}>{data.performanceIndicator.maxTenure}</span>&nbsp;Months</div> -->
    <div><span class={minTenureClass}>{data.performanceIndicator.minTenure}</span>M&nbsp;/&nbsp;<span class={maxTenureClass}>{data.performanceIndicator.maxTenure}</span>M</div>
  </div>
  <div class="experiencedetail">
    <!-- <span class="experienceheading">Average Tenure in a Company</span><div><span class={avgTenureClass}>{data.performanceIndicator.avgTenure}</span>&nbsp;Months</div> -->
    <span class="experienceheading">Average Tenure in a Company</span><div><span class={avgTenureClass}>{data.performanceIndicator.avgTenure}</span>M</div>
  </div>
  <div class="experiencedetail">
    <span class="experienceheading">Number of companies worked for</span><div><span style="font-size: 18px;">{numberOfCompaniesWorkedFor}</span></div>
  </div>
</div>
<div class="headingContent slds-text-align_left paddingTop">
  <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 384 512">
    <path d="M48 0C21.5 0 0 21.5 0 48V464c0 26.5 21.5 48 48 48h96V432c0-26.5 21.5-48 48-48s48 21.5 48 48v80h96c26.5 0 48-21.5 48-48V48c0-26.5-21.5-48-48-48H48zM64 240c0-8.8 7.2-16 16-16h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H80c-8.8 0-16-7.2-16-16V240zm112-16h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H176c-8.8 0-16-7.2-16-16V240c0-8.8 7.2-16 16-16zm80 16c0-8.8 7.2-16 16-16h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H272c-8.8 0-16-7.2-16-16V240zM80 96h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H80c-8.8 0-16-7.2-16-16V112c0-8.8 7.2-16 16-16zm80 16c0-8.8 7.2-16 16-16h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H176c-8.8 0-16-7.2-16-16V112zM272 96h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H272c-8.8 0-16-7.2-16-16V112c0-8.8 7.2-16 16-16z" />
  </svg>
  Work History <span class="fontWeight300">(latest first)</span>
</div>
<div class="performancecontainer">
  <template if:true={companyList}>
      <template for:each={companyData} for:item="company">
          <div class="performance__data" key={company}>
            <!-- <span class="cname">{company.name}</span> <span class="month">{company.month}</span><span class="workdomain">{company.domain}</span> -->
            <span class="cname">{company.name}</span>
            <span class="month">
              <span if:true={company.month.year}>{company.month.year}<span style="font-size:10px">Y&nbsp;</span></span>
              <span if:true={company.month.month}>{company.month.month}<span style="font-size:10px">M</span></span>
            </span>
            <span class="workdomain">{company.domain}</span>
          </div>
      </template>
  </template>
</div>
</div>
<!-- <div class="blurry-container"> -->
<div class="score">
  <div class="score-container">
     <div class="scorePopup">
    <div class="scoreInfo">Tech Score :</div><div class="scoreNumber">{data.techScore}</div>
    <div class="scoreInfo">Admin Score :</div><div class="scoreNumber">{data.adminScore}</div>
    <div class="scoreInfo">Tools Score :</div><div class="scoreNumber">{data.toolScore}</div>
    <div class="scoreInfo">Certification Score :</div><div class="scoreNumber">{data.certScore}</div>
    <div class="scoreInfo">Verticals Score :</div><div class="scoreNumber">{data.verticalsScore}</div>
    <div class="scoreInfo">SF Clouds Score :</div><div class="scoreNumber">{data.cloudScore}</div>
  </div>
</div>
<div class="sContainer">
  <div class="score-heading">These insights are AI-generated. Consider verifying key information.</div>
</div>
<div class="headingContent slds-text-align_left">
  <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 640 512">
    <path d="M353.8 54.1L330.2 6.3c-3.9-8.3-16.1-8.6-20.4 0L286.2 54.1l-52.3 7.5c-9.3 1.4-13.3 12.9-6.4 19.8l38 37-9 52.1c-1.4 9.3 8.2 16.5 16.8 12.2l46.9-24.8 46.6 24.4c8.6 4.3 18.3-2.9 16.8-12.2l-9-52.1 38-36.6c6.8-6.8 2.9-18.3-6.4-19.8l-52.3-7.5zM256 256c-17.7 0-32 14.3-32 32V480c0 17.7 14.3 32 32 32H384c17.7 0 32-14.3 32-32V288c0-17.7-14.3-32-32-32H256zM32 320c-17.7 0-32 14.3-32 32V480c0 17.7 14.3 32 32 32H160c17.7 0 32-14.3 32-32V352c0-17.7-14.3-32-32-32H32zm416 96v64c0 17.7 14.3 32 32 32H608c17.7 0 32-14.3 32-32V416c0-17.7-14.3-32-32-32H480c-17.7 0-32 14.3-32 32z" />
  </svg>Candidate Score :<span class="overallscoreHover"> {data.overallScore}/10</span>
</div>
<div class="info">
  <svg class="infosvg" title ="Hello" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336h24V272H216c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c13.3 0 24 10.7 24 24v88h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H216c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-208a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/></svg>
</div>
<!-- </div> -->
</div>

<div class="cardHeadingCaraousel">
  <svg class="slds-icon slds-icon_small carousel_icon" focusable="false" data-key="chevronleft" aria-hidden="true" viewBox="0 0 52 52" part="icon" data-direction="left" onclick={handleLeftClick}>
<g>
  <path d="M34.2 47.7L13.4 27.2c-.6-.6-.6-1.6 0-2.2L34.2 4.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L22.1 25c-.6.6-.6 1.6 0 2.2l16.3 16.1c.6.6.6 1.6 0 2.2l-2.2 2.2c-.5.5-1.4.5-2 0z"></path>

  <div class="right-half" data-direction="right" onclick={handleRightClick}>{rightCardHeading}</div>

  <svg class="slds-icon slds-icon_small carousel_icon" focusable="false" data-key="chevronright" aria-hidden="true" viewBox="0 0 52 52" part="icon" data-direction="right" onclick={handleRightClick}>

</g>
</svg>
</div>

</template>

</div>
<template if:true={resumeInsightRecord}>

<div class="card4 right__card">
