	<lightning-card>
    <div class="main-board">
        <div class="board">
            <div class="card" data-target="policy-documents" onclick={handleNavigation}>
                <div class="card-header">
                    <div class="image-placeholder">
                        <img class="image-size" src={policiesIMG} alt="policiesIMG">
                    </div>
                </div>
                <div class="card-body slds-border_top">
                    <h3 class="title">
                        <span class="color-code1">Zoho</span><span class="color-code2">360</span>
                    </h3>
                    <h3 class="title-tab">Policies</h3>
                    <p class="updated-info">Description</p>
                </div>
            </div>
            
            <div class="card" onclick={handleNavigation}>
                <div class="card-header">
                    <div class="image-placeholder">
                        <img class="image-size" src={travelRequest} alt="travelRequest">
                    </div>
                </div>
                <div class="card-body slds-border_top">
                    <h3 class="title">
                        <span class="color-code1">Zoho</span><span class="color-code2">360</span>
                    </h3>
                    <h3 class="title-tab">Travel Request</h3>
                    <p class="updated-info">Description</p>
                </div>
            </div>

            <div class="card" data-target= "expense-claims" onclick={handleNavigation}>
                <div class="card-header">
                    <div class="image-placeholder">
                        <img class="image-size" src={expenseClaim} alt="ExpenseClaim">
                    </div>
                </div>
                <div class="card-body slds-border_top">
                    <h3 class="title">

            </div>

                        <img class="image-size" src={resignation} alt="resignation">

                </div>
                <div class="card-body slds-border_top">
                    <h3 class="title">
                        <span class="color-code1">Zoho</span><span class="color-code2">360</span>
                    </h3>
                    <h3 class="title-tab">Resignations</h3>
