<template>
    <div class="slds-page-header slds-page-header_record-home bgColorHeader">
        <div class="slds-page-header__row">
            <template if:true={showHeaderSpinner}>
                <div class="backgroundInverse">
                    <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
                </div>
            </template>
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:feedback" alternative-text="Interview" variant="inverse" size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <h1>
                                    <span>Interview</span>
                                    <span class="slds-page-header__title slds-truncate" title={interviewAutoNumber}>{interviewAutoNumber}</span>
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls">
                    <div class="slds-page-header__control">
                        <ul class="slds-button-group-list">
                            <li>
                                <button class="slds-button slds-button_success color-icon slds-text-title_bold" onclick={handleInterviewForm} disabled={checkRole}>{EvaluationBtnLabel}</button>
                            </li>
                             <li>
                                <button class="slds-button slds-button_success color-icon slds-text-title_bold" onclick={handleInterviewInvite}>{InterviewBtnLabel}</button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template if:true={isOpenFeedbackForm}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-modal_large slds-fade-in-open">
            <div class="slds-modal__container">
             <!-- modal header start -->
               <header class="slds-modal__header">
                  <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClosePopup}>
                     <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                     <span class="slds-assistive-text">Close</span>
                  </button>
                  <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{interviewDetails.role} - Interview Evaluation Form</h2>
               </header>
           
               <!-- modal body start -->
               <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <template if:true={showSpinner}>
                    <div class="backgroundInverse">
                        <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
                    </div>
                </template>
                <lightning-card>
                    <div class="slds-m-left_medium slds-m-right_medium slds-box slds-box_x-small slds-text-align_center slds-text-heading_bold slds-text-heading_small">
                        <h3>Candidate Form</h3>
                    </div>
                    <div class="slds-p-around_medium">
                        <div class="slds-grid slds-gutters slds-p-bottom_medium">
                            <div class="slds-col slds-size_1-of-5">
                                <label for="name" class="slds-form-element__label slds-text-body_regular slds-border_bottom">Candidate Name</label>
                                <div><span>{interviewDetails.candidateName}</span></div>
                            </div>
                            <div class="slds-col slds-size_1-of-5">
                                <label for="name" class="slds-form-element__label slds-text-body_regular slds-border_bottom">Requisition Name</label>
                                <div><span>{interviewDetails.requistionName}</span></div>
                            </div>
                            <div class="slds-col slds-size_1-of-5">
                                <label for="name" class="slds-form-element__label slds-text-body_regular slds-border_bottom">Evaluation Feedback Template</label>
                                <div><span>{interviewDetails.role}</span></div>
                            </div>
                            <div class="slds-col slds-size_1-of-5">
                                <label for="name" class="slds-form-element__label slds-text-body_regular slds-border_bottom">Interviewer Name</label>
                                <div><span>{interviewDetails.interviewerName}</span></div>
                            </div>
                            <div class="slds-col slds-size_1-of-5">
                                <label for="dateOfInterview" class="slds-form-element__label slds-text-body_regular slds-border_bottom">Date Of Interview</label>
                                <div>
                                    <span>
                                        <lightning-formatted-date-time value={interviewDetails.dateOfInterview} year="numeric" month="numeric" day="numeric" time-zone="GMT"></lightning-formatted-date-time>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="slds-form-element__label slds-text-body_regular slds-border_bottom"><abbr title="required" class="slds-required">*</abbr>Mode Of Interview</label>
                            <div class="slds-text-body_regular">
                                <template if:false={showVideoCall}>
                                    <lightning-input type="checkbox" name="Video Call / Virtual" label={secondModeOfInterview} checked={isVideoCall} onchange={handleCheckbox} disabled={isSubmitted}></lightning-input>
                                </template>
                                <lightning-input type="checkbox" name="Face to Face" label={firstModeOfInterview} checked={isFaceToFace} onchange={handleCheckbox} disabled={isSubmitted}></lightning-input>
                                <template if:true={showVideoCall}>
                                    <lightning-input type="checkbox" name="Video Call / Virtual" label={secondModeOfInterview} checked={isVideoCall} onchange={handleCheckbox} disabled={isSubmitted}></lightning-input>
                                </template>
                                <lightning-input type="checkbox" name="Telephonic" label={thirdModeOfInterview} checked={isTelephonic} onchange={handleCheckbox} disabled={isSubmitted}></lightning-input>
                            </div>
                        </div><br>
                        <div class="slds-box">
                            <p>{instruction}</p>
                        </div>
                    </div>
                    <lightning-accordion allow-multiple-sections-open active-section-name={activeSessions}>
                        <lightning-accordion-section name="Rating Details" label="Rating Details">
                            <lightning-card>
                                <div class="slds-m-left_medium slds-m-right_medium slds-box slds-box_x-small slds-text-align_center slds-text-heading_bold slds-text-heading_small">
                                    <h3>Rating Scale </h3>
                                </div>
                                <div class="slds-m-left_medium slds-text-body_regular slds-text-heading_bold">
                                    <div class="slds-p-top_small rows">
                                        <div style="background-color: #e85d04;" class="icon-container">
                                            <div class="icon-background">
                                                <span class="number">1</span>
                                            </div>
                                        </div>
                                        <div class="slds-p-left_small">
                                            <p>{oneStar}</p>
                                        </div>
                                    </div>
                                    <div class="slds-p-top_small rows">
                                        <div style="background-color: #f48c06;" class="icon-container">
                                            <div class="icon-background">
                                                <span class="number">2</span>
                                            </div>
                                        </div>
                                        <div class="slds-p-left_small">
                                            <p>{twoStar}</p>
                                        </div>
                                    </div>
                                    <div class="slds-p-top_small rows">
                                        <div style="background-color: #ffba08;" class="icon-container">
                                            <div class="icon-background">
                                                <span class="number">3</span>
                                            </div>
                                        </div>
                                        <div class="slds-p-left_small">
                                            <p>{threeStar}</p>
                                        </div>
                                    </div>
                                    <div class="slds-p-top_small rows">
                                        <div style="background-color: #80b918;" class="icon-container">
                                            <div class="icon-background">
                                                <span class="number">4</span>
                                            </div>
                                        </div>
                                        <div class="slds-p-left_small">
                                            <p>{fourStar}</p>
                                        </div>
                                    </div>
                                    <div class="slds-p-top_small slds-p-bottom_small rows">
                                        <div style="background-color: #55a630;" class="icon-container">
                                            <div class="icon-background">
                                                <span class="number">5</span>
                                            </div>
                                        </div>
                                        <div class="slds-p-left_small">
                                            <p>{fiveStar}</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-m-left_medium slds-m-right_medium slds-box slds-box_x-small slds-text-align_center slds-text-heading_bold slds-text-heading_small ">
                                    <h3>Overall Assessment On Technology<abbr title="required" class="slds-required">*</abbr></h3>
                                </div>
                                <div class="slds-p-horizontal_medium">
                                    <table class="slds-box slds-p-around_none slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-size_x-medium slds-m-top_medium slds-has-cell-padding slds-table_fixed-layout">
                                        <thead>
                                            <tr class="slds-text-heading_bold slds-text-heading_x-small">
                                                <th scope="col" class="slds-size_x-large" style="width: 50%;">
                                                    <div class="slds-m-around_x-small slds-p-left_small">Skills</div>
                                                </th>
                                                <th scope="col" class="slds-size_x-small" style="width: 25%;">
                                                    <div class="slds-m-around_x-small slds-p-left_small">Rating<lightning-helptext content="On a scale from 1 to 5, with 1 being the minimum and 5 being the maximum, skills not selected will not be taken into consideration."></lightning-helptext></div>
                                                </th>
                                                <th scope="col" class="slds-size_x-small" style="width: 25%;">
                                                    <div class="slds-m-around_x-small slds-p-left_small">Justify</div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={interviewDetails.interviewWrap} for:item="eachSkill" for:index="index">
                                                <tr class="slds-hint-parent" key={eachSkill.id}>
                                                    <td class="slds-size_xx-medium">
                                                        <div class="slds-p-left_small" style="white-space: normal;">{eachSkill.question}</div>
                                                    </td>
                                                    <td class="slds-size_x-small">
                                                        <c-full-star-rating name={eachSkill.question} default-rating={eachSkill.rating} outerindex={eachSkill.id} inner-index={index} noedit={isSubmitted} onratingclick={handleRating}></c-full-star-rating>
                                                    </td>
                                                    <td class="slds-size_xx-medium">
                                                        <div class="slds-p-around_small">
                                                            <lightning-textarea variant="label-hidden" name={eachSkill.id} value={eachSkill.justification} data-innerindex={index} data-questionname={eachSkill.question} onchange={handleJustify} disabled={isSubmitted}></lightning-textarea>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </lightning-card>
                        </lightning-accordion-section>
                        <lightning-accordion-section name="Overall Comments" label="Overall Comments">
                            <lightning-card>
                                <div class="slds-m-left_medium slds-m-right_medium slds-box slds-box_x-small slds-text-align_center slds-text-heading_bold slds-text-heading_small">
                                    <h3>Overall Comments On Interview </h3>
                                </div>
                                <div class="slds-grid slds-wrap slds-p-around_medium">
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_small">
                                        <!-- <span><abbr title="required" class="slds-required">*</abbr>People Capability (Please comment on the candidates People Capability)</span> -->
                                        <span><abbr title="required" class="slds-required">*</abbr>{firstCommentText}</span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_small">
                                        <span>
                                            <lightning-textarea class="slds-size_5-of-5" variant="label-hidden" name="People Capability" value={interviewData.peopleCapability} onchange={handleTextArea} disabled={isSubmitted}></lightning-textarea>
                                        </span>
                                    </div>
                                    <template if:true={showComments}>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_medium">
                                        <!-- <span><abbr title="required" class="slds-required">*</abbr>Process Maturity (Please comment on the candidates understanding of processes)</span> -->
                                        <span><abbr title="required" class="slds-required">*</abbr>{secondCommentText}</span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_small">
                                        <span>
                                            <lightning-textarea class="slds-size_5-of-5 slds-p-top_small" variant="label-hidden" name="Process Maturity" value={interviewData.processMaturity} onchange={handleTextArea} disabled={isSubmitted}></lightning-textarea>
                                        </span>
                                    </div>
                                    </template>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_medium">
                                        <!-- <span><abbr title="required" class="slds-required">*</abbr>Project Knowledge &amp; Domain Expertise (Please comment on the candidate’s project/domain knowledge)</span> -->
                                        <span><abbr title="required" class="slds-required">*</abbr>{thirdCommentText}</span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_small">
                                        <span>
                                            <lightning-textarea class="slds-size_5-of-5 slds-p-top_small" variant="label-hidden" name="Project Knowledge" value={interviewData.projectKnowledge} onchange={handleTextArea} disabled={isSubmitted}></lightning-textarea>
                                        </span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_medium">
                                        <!-- <span><abbr title="required" class="slds-required">*</abbr>Attitude ( Please comment on the candidate’s general attitude to work and to life)</span> -->
                                        <span><abbr title="required" class="slds-required">*</abbr>{fourthCommentText}</span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_small">
                                        <span>
                                            <lightning-textarea class="slds-size_5-of-5 slds-p-top_small" variant="label-hidden" name="Attitude" value={interviewData.Attitude} onchange={handleTextArea} disabled={isSubmitted}></lightning-textarea>
                                        </span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_medium">
                                        <span><abbr title="required" class="slds-required">*</abbr>Overall Comments</span>
                                    </div> 
                                    <div class="slds-col slds-size_6-of-12 slds-m-top_small">
                                        <span>
                                            <lightning-textarea class="slds-size_5-of-5 slds-p-top_small" placeholder="Comments (Please summarize your perceptions of the candidate’s strengths and any concerns that should be considered:" variant="label-hidden" name="Comments" value={interviewData.Comments} onchange={handleTextArea} disabled={isSubmitted}></lightning-textarea>
                                        </span>
                                    </div>  
                                </div>
                                <!-- <div>
                                    <lightning-textarea class="slds-size_5-of-5 slds-p-around_medium" 
                                        placeholder="Comments (Please summarize your perceptions of the candidate’s strengths and any concerns that should be considered:"
                                        variant="label-hidden" name="Comments" value={interviewData.Comments} onchange={handleTextArea} disabled={isSubmitted}></lightning-textarea>
                                </div> -->
                            </lightning-card>   
                        </lightning-accordion-section>
                        <lightning-accordion-section name="Recommendation" label="Recommendation">
                            <lightning-card>
                                <div class="slds-m-left_medium slds-m-right_medium slds-box slds-box_x-small slds-text-align_center slds-text-heading_bold slds-text-heading_small">
                                    <h3>Recommendation<abbr title="required" class="slds-required">*</abbr></h3>
                                </div>
                                <div class="slds-m-left_medium slds-m-top_medium">
                                    <div style="display:flex">
                                    <lightning-input class="slds-m-bottom-small slds-p-bottom_x-small" type="checkbox" name="Hire"
                                        label="Hire" checked={isHire} onchange={handleRecommendation} variant="label-hidden" disabled={isSubmitted}></lightning-input>
                                    <label class="slds-form-element__label slds-text-body_regular">Select</label>
                                    </div>
                                    <!-- <div class="recDescription">
                                        <div style="display:flex">
                                        <lightning-input class="slds-m-bottom-small slds-p-bottom_x-small" type="checkbox" name="Recommend Interview"
                                            label="Recommending for other positions within CRMIT :"
                                            checked={isRecommendInterview} onchange={handleRecommendation} variant="label-hidden" disabled={isSubmitted}>
                                        </lightning-input>
                                        <label class="slds-form-element__label slds-text-body_regular">Recommending for other positions within CRMIT :</label>
                                        </div>
                                        <template if:true={isRecommendInterview}>
                                            <lightning-textarea class="slds-size_2-of-5" label="Reason for recommendation" variant="label-hidden" value={interviewData.recommendPosition} onchange={handlePosition} disabled={isSubmitted}></lightning-textarea>
                                        </template>
                                    </div> -->
                                    <div style="display:flex">
                                        <lightning-input type="checkbox" name="Reject" label="Reject" checked={isReject} onchange={handleRecommendation} variant="label-hidden" disabled={isSubmitted}></lightning-input>
                                        <label class="slds-form-element__label slds-text-body_regular">Reject</label>
                                    </div>
                                </div>
                            </lightning-card>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </lightning-card>
               </div>
     
               <!-- modal footer start-->
               <footer class="slds-modal__footer">
                  <lightning-button class="slds-m-around_xx-small" variant="brand" label="Cancel" onclick={handleClosePopup}></lightning-button>
                  <template if:false={isSubmitted}>
                    <lightning-button variant="brand" label="Save" onclick={submitForm}></lightning-button>
                  </template>
               </footer>
            
            </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
