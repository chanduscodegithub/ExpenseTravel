                            <div class="projectInfoCard slds-p-top_medium" if:false={projectAlloc.otherAlloc}>
                                <span class="slds-text-heading_small"><b>Region: </b>{projectAlloc.region},</span> &emsp;
                                <span class="slds-text-heading_small"><b>Reporting Manager: </b>{projectAlloc.manager},</span> &emsp;

                                        </span>
                                    </label>
                                </div>

                                <div class="clearFloat"></div> <!-- Add a clearing div -->

                                    <div class="flex-container">
                                        <p key={index} style="margin-right: 10px;">{projectAlloc.fileName}</p>
                                        <lightning-icon if:true={projectAlloc.fileName} icon-name="utility:close" size="x-small" data-id={index} onclick={removeFile}></lightning-icon>
                                    </div>
                                </div>
                            </div>
                            </br>
                            <table class="slds-table slds-table_bordered">

                                        </th>

                                        </th>
                                    </tr>

                                                </div>

                                                </div>
                                            </td>
                                            <td scope="row" style="width: 14%;">
                                                <div class="slds-truncate catCol" title="Category">

                                                </div>
                                            </td>
                                            <td scope="row" style="width: 14%;">
                                                <div class="slds-truncate subcatCol" title="Sub-Category">
                                                    <lightning-combobox name="Sub-Category" value={eachTS.eachDate.sub_category} placeholder="" options={eachTS.eachDate.subcatOptions} data-project={projectAlloc.key} data-id={eachTS.key} data-infofor="sub_category" onchange={handleInput} required disabled={eachTS.eachDate.disableline} message-when-value-missing="Field is mandatory."></lightning-combobox>
                                                </div>
                                            </td>
                                            <td scope="row" if:false={eachTS.eachDate.leaveField} style="width: 6%;">
                                                <div class="slds-truncate hourCol" title="Hours">

                                                </div>
                                            </td>
                                            <td scope="row" if:true={eachTS.eachDate.leaveField}  style="width: 6%;">

                                                    <lightning-combobox name="Hours" value={eachTS.eachDate.work_hour} placeholder="" options={leaveHoursOpt} data-project={projectAlloc.key} data-id={eachTS.key} data-infofor="work_hour" onchange={handleInput} required disabled={eachTS.eachDate.disableline} message-when-value-missing="Field is mandatory."></lightning-combobox>
                                                </div>
                                            </td>
                                            <td scope="row">
                                                <div class="slds-truncate descriptCol1" title="Description">
                                                    <lightning-textarea type="text" name="Description" value={eachTS.eachDate.description} data-project={projectAlloc.key} data-id={eachTS.key} data-infofor="description" onchange={handleInput} required disabled={eachTS.eachDate.disableline} message-when-value-missing="Field is mandatory."></lightning-textarea>
                                                </div>
                                            </td>
                                            <td scope="row" if:false={eachTS.eachDate.disableline}>

                        <lightning-button label="Submit" variant="brand" title="Submit" onclick={handleConfirmation} class="slds-m-left_x-small" disabled={lockedToEdit}></lightning-button>
                        <!--<lightning-button if:true={loadReportButton} icon-name="utility:report_issue" label="Error logging timesheet? " title="Report an Issue" onclick={handleReport} variant="brand" class="slds-float_left slds-m-left_x-small reportIconBtn"></lightning-button>-->
                    </div>
                    <div class="downButtons" if:true={managerView}>
                        <lightning-button label="Back" variant="brand" title="Back" onclick={handleBack} class="slds-m-left_x-small"></lightning-button>
                        <lightning-button label="Reject" variant="success" title="Reject" onclick={handleRejection} class="slds-m-left_x-small" disabled="true"></lightning-button>
                        <lightning-button label="Approve" variant="brand" title="Approve" onclick={handleApproval} class="slds-m-left_x-small" disabled="true"></lightning-button>
                    </div>
                    <div class="errorReportBtn">
                        <lightning-button-icon icon-name="utility:report_issue" if:true={loadReportButton} title="Report an Issue" onclick={handleReport} variant="bare" class="slds-float_left slds-m-left_x-small reportIconBtn"></lightning-button-icon>
                        <a if:true={loadReportButton} title="Report an Issue" onclick={handleReport} variant="brand" class="slds-float_left reportIconBtn">Error logging timesheet?</a>
                    </div>
                </div>
            </div>
        </div>
        <!--Modal-->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={previousPage}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Select Date</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        Hello, {empObj.Name}
                        <lightning-input type="date" name="Week Start Date" label="Week Start Date" required value={todayPlaceholder} onchange={onDateChange}></lightning-input>
                        </br>
                        <!--<lightning-input type="checkbox" label="Working on Weekend?" name="Weekend" checked={workaholic} onchange={handleWeekendWorkaholic}></lightning-input>-->
                        </br>
                        </br>Note: Select any day of the week (Mon-Sun), to log timesheets for that week.
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={previousPage} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={submitStartDate} title="OK">OK</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--Clone Date-->
        <template if:true={isCloneOpen}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeClone}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Clone Details</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium cloneDetails" id="modal-content-id-2">
                        <span class="slds-text-body_regular">Cloning from: {cloneInfo.cloneDatePretty}</span>&emsp;
                        <lightning-icon icon-name="utility:forward" alternative-text="Upto" title="Upto Icon"></lightning-icon>&emsp;
                        <span class="slds-text-body_regular">Clone upto: {cloneInfo.initDatePretty}</span>
                        </br>
                        <p>Select clone required upto:</p>
                        <lightning-input type="date" name="" label="To extend cloning to further date, please select from below:" required value={cloneInfo.initNextDay} disabled={cloneInfo.lastDay} onchange={onCloneDateChange}></lightning-input>
                        </br>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeClone} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={processClone} title="OK">OK</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--Submit Confirmation-->
        <template if:true={confirmBox}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeConfirm}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate">Confirmation</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
                        <span class="slds-text-body_regular">{confirmBoxMsg}</span>
                        <!--<p class="slds-text-body_regular">Once submitted timesheet cannot be modified, you want to proceed?</p>-->
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeConfirm} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={handleSubmit} title="Proceed">Proceed</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--Delete Confirmation-->

                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeDelete}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-04" class="slds-text-heading_medium slds-hyphenate">Confirmation</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-4">
                        <span class="slds-text-body_regular">Are you sure you want to proceed?</span>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeDelete} title="No">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={confirmDelete} title="Yes">Yes</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!--Approval Confirmation-->
        <template if:true={showApprovalBox}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeApprovalBox}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-06" class="slds-text-heading_medium slds-hyphenate">{approvalBoxHeading}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-6">
                        <lightning-textarea type="text" name="Description" onchange={handleDescriptionInput} value={approvalDescription} placeholder={approvalBoxPlaceholder}></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeApprovalBox} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={submitApproval} title="Submit">{approvalBoxLabel}</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--Report Confirmation-->
        <template if:true={reportFlag}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <c-report-issue ongetflagvalue={handleClose}></c-report-issue>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </article>
</template>
