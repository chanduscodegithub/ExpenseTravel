<!--reuseable custom file upload cmp---->
<template>
    <lightning-card title="File Upload Demo LWC" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
            <lightning-input type="file" accept={acceptFormat} label="Attachment" onchange={openfileUpload}>
            </lightning-input>
        </div>
        <template if:true={fileData}>
            <p>{fileData.filename}</p>
        </template>
        <lightning-button variant="brand" label="Submit" title="Submit" onclick={handleClickSave}
            class="slds-m-left_x-small" disabled={isDiabled}></lightning-button>
        <lightning-button variant="brand" label="Clear" title="Clear" onclick={handleClear}
            class="slds-m-left_x-small"></lightning-button>
    </lightning-card>
</template>
