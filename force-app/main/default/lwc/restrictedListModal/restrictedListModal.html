<!-- sldsValidatorIgnore -->
<template>
  <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
          <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
          <span class="slds-assistive-text">Close</span>
        </button>
        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Restricted Holiday</h2>
      </header>
      <div class="slds-modal__content slds-p-around_medium modalpopup" id="modal-content-id-1">
        <table>
          <caption>
            Please select leaves from below:
          </caption>
          <thead>
            <tr>
              <th scope="col">Restricted Holiday</th>
              <th scope="col">Select</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={restrictedLeaves} for:item="eachRestricted">
              <tr key={eachRestricted.key}>
                <td>
                  <div class="custom-box slds-p-around_medium slds-text-align_center colum">{eachRestricted.name} &nbsp;({eachRestricted.dateStr})</div>
                </td>
                <td>
                  <lightning-input class="checkbox column" type="checkbox" name="Opt-in" data-key={eachRestricted.key} data-name={eachRestricted.name} onchange={handleCheck} checked={eachRestricted.leaveOpted} disabled={eachRestricted.used}></lightning-input>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <footer class="slds-modal__footer">
        <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
        <button class="slds-button slds-button_brand" onclick={confirmSelection} title="Apply">Apply</button>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open"></div>
</template>
