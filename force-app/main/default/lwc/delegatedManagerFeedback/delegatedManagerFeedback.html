<template>
<div if:true={showPopUp} class="custom-modal">
<section role="dialog" class="slds-modal slds-fade-in-open">

<div class="slds-modal__container">
    <header class="slds-modal__header">
        <span class="slds-modal__close">
            <lightning-icon icon-name="utility:close" variant="inverse" alternative-text="close" onclick={closePopUp}></lightning-icon>
        </span>
        <h2 class="slds-text-heading_medium slds-hyphenate">Select Project Leaders</h2>
    </header>
    <div class="slds-modal__content slds-p-around_medium">
        <template if:true={showLoading}>
            <lightning-spinner alternative-text="Loading" if:true={isLoading} size="small"></lightning-spinner>
        </template>
    <lightning-input name="Project Associate1"  label="Project Associate1" type={type1} value={PAname} onchange={searchForManager} disabled={isManagerSubmitted}></lightning-input>
    <div  if:true={displayDropDown1} class="slds-dropdown_left slds-dropdown_length-5 slds-dropdown_fluid dropdown isdropdown" role="listbox">            
    <ul class="slds-listbox slds-listbox_vertical" role="presentation" >
    <template for:each={searchedManagerResultList} for:item="searchResult">
        <li key={searchResult.value} data-value={searchResult.value} data-label={searchResult.label} data-msg={name} role="presentation" 
            onclick={selectDesignationFromSearchResult} class="slds-listbox__item"  onblur={onblurchange}>
            <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option">
                <span class="slds-media__body">
                    <span class="slds-truncate" title={searchResult.label}>
                        {searchResult.label}
                    </span>
                </span>
            </div>
            
        </li>
    </template>

</ul>
</div>
