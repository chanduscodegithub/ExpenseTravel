<template>
	<template if:true={isCheckboxHidden}>
		<div class="slds-hide">
			<lightning-input type="checkbox" checked={isEligibleForQuota} disabled class="transparent-checkbox">
			</lightning-input>
		</div>
	</template>
	<template if:false={isCheckboxHidden}>
		<lightning-input type="checkbox" checked={isEligibleForQuota} disabled class="transparent-checkbox">
		</lightning-input>
	</template>
	<!-- Rest of the component will be conditionally rendered based on the checkbox value -->
	<template if:true={isEligibleForQuota}>
		<lightning-card variant="narrow" title="Avishkaar - Quota Attainment Tracker" icon-name="standard:opportunity">
			<lightning-button variant="brand" label="Quota Target" title="Click here quota target record list view"
				onclick={navigateToRecordList} slot="actions"></lightning-button>
			<div class="slds-text-heading_larger" slot="title" style="font-size: 18px">
				Avishkaar - Quota Attainment System
			</div>
			<div class="year-region-selection">
				<div class="year-selection">
					<label class="large-font" style="display: inline-block; font-size: 13.5px; padding-right: 10px;">Select Financial Year</label>
					<lightning-combobox options={yearOptions} value={selectedYear} onchange={handleYearChange}
						style="display: inline-block;font-size:13px;"></lightning-combobox>
				</div>
				<div class="region-selection">
					<label class="large-font" style="display: inline-block; font-size: 13.5px; padding-right: 10px;">Select Region</label>
					<lightning-combobox options={regionOptions} value={selectedRegion} onchange={handleRegionChange}
						style="display: inline-block;font-size:13px;"></lightning-combobox>
				</div>
			</div>
			<lightning-tabset class="spaced-tabs">
				<!-- Yearly Attainment Review Tab -->
				<template if:true={selectedYear}>
					<lightning-tab class="parent-tab" label="Sales-Attainment-Yearly">
						<lightning-tabset>
							<template for:each={financialPlanningRecords} for:item="record" for:index="outerindex">
								<template if:true={record.showFinancialPlanningTab}>
									<lightning-tab key={record.Id} label={record.Name} onactive={handleTabSelection}>
										<template if:true={record.employeeDetails}>
											<!-- Display employee details here -->
											<div class="slds-flexbox">
												<table class="slds-table slds-table_bordered slds-table_cell-buffer">
													<thead>
														<tr class="slds-text-title">
															<th scope="col" class="slds-text-align_center">Employee
															</th>
															<th scope="col" class="slds-text-align_center">Role </th>
															<th scope="col" class="slds-text-align_center">Currency</th>

															<th scope="col" class="slds-text-align_center">
																<template if:true={selectedTabLabelContainsQuota}>
																	Quota
																</template>
																<template if:true={selectedTabLabelContainsBudget}>
																	Budget
																</template>
																<template if:true={selectedTabLabelContainsAspiration}>
																	Aspiration
																</template>
															</th>
															<th scope="col" class="slds-text-align_center">Actuals</th>
															<th scope="col" class="slds-text-align_center">Attain(%)
															</th>
														</tr>
													</thead>
													<tbody>
														<template for:each={record.employeeDetails} for:item="employee"
															for:index="innerindex">
															<tr key={employee.Id}>
																<td>
																	<div class="wrap-text">
																		<h1 data-id={employee.Id} class="larger5-font">
																			<template if:true={employee.Employees__r}>
																				{employee.Employees__r.Name}
																			</template>
																		</h1>
																	</div>
																</td>
																<td class="slds-text-align_left">{employee.Role__r.Name}
																</td>
																<td class="slds-text-align_center">
																	{employee.Currency__c}</td>
																<td class="slds-text-align_right">
																	<lightning-formatted-number
																		value={employee.Yearly_Target__c}>
																	</lightning-formatted-number>
																</td>
																<td class="slds-text-align_right">
																	<a>
																		<lightning-formatted-number
																			value={employee.Yearly_Opportunity_Actuals__c}
																			minimum-fraction-digits="0"
																			data-index={outerindex} data-id={innerindex}
																			data-msg="Year" onclick={getOpportunity}>
																		</lightning-formatted-number>
																	</a>
																</td>
																<td class="slds-text-align_right1">
																	<div
																		class={employee.Yearly_Opp_Attainment_Colour__c}>
																		{employee.Yearly_Opportunity_Attainment__c}%
																	</div>
																</td>
															</tr>
														</template>
													</tbody>
													<!-- Summary Row -->
													<template if:true={record.employeeDetails.length}>
														<tr key={total} class='total-row'>
															<td colspan="3" class="slds-text-align_right">
																Summary
															</td>
															<td class="slds-text-align_right">
																<lightning-formatted-number value={totalQuota}>
																</lightning-formatted-number>
															</td>
															<td class="slds-text-align_right">
																<lightning-formatted-number value={totalActuals}
																	minimum-fraction-digits="0">
																</lightning-formatted-number>
															</td>
															<td class={getClassForAttainment}>
																<lightning-formatted-number value={totalAttainment}>
																</lightning-formatted-number>%
															</td>
														</tr>
													</template>
												</table>
											</div>
										</template>
										<template if:false={record.employeeDetails}>
											<p>No employee details available.</p>
										</template>
									</lightning-tab>
								</template>
							</template>
							<template for:each={tabLabels} for:item="tabLabel">
								<lightning-tab key={tabLabel} label={tabLabel}>
									<div>
										<!-- Display employee details here -->
										<div class="slds-flexbox">
											<table class="slds-table slds-table_bordered slds-table_cell-buffer">
												<thead>
													<tr class="slds-text-title">
														<th scope="col" class="slds-text-align_center">Employee</th>
														<th scope="col" class="slds-text-align_center">Role</th>
														<th scope="col" class="slds-text-align_center">Currency</th>

														<th scope="col" class="slds-text-align_center">Aspiration
														</th>
														<th scope="col" class="slds-text-align_center">Actuals</th>
														<th scope="col" class="slds-text-align_center">Attain(%)</th>
													</tr>
												</thead>
												<tbody>
													<!-- Iterate over each financialPlanningRecord -->
													<template for:each={financialPlanningRecords} for:item="record"
														key={record.Id} for:index="outerindex">
														<!-- Iterate over each employeeDetail within the record -->
														<template for:each={record.employeeDetails}
															for:item="employeeDetail" key={employeeDetail.Id}
															for:index="innerindex">
															<tr key={employeeDetail.Id}>
																<td>
																	<div class="wrap-text">
																		<h1 data-id={record.Id} class="larger5-font">
																			{employeeDetail.Employees__r.Name}
																		</h1>
																	</div>
																</td>
																<td class="slds-text-align_left">
																	{employeeDetail.Role__r.Name}
																</td>
																<td class="slds-text-align_center">
																	{employeeDetail.Currency__c}
																</td>
																<td class="slds-text-align_right">
																	<lightning-formatted-number
																		value={employeeDetail.Yearly_Aspiration_Goals__c}

																	</lightning-formatted-number>
																</td>
																<td class="slds-text-align_right">
																	<a>

																	</a>
																</td>
																<td class="slds-text-align_right1">
																	<div

																		{employeeDetail.Yearly_Aspiration_Attainment__c}%
																	</div>
																</td>
															</tr>
														</template>
													</template>
												</tbody>
												<!-- Summary Row -->
												<tr key={total} class='total-row'>
													<td colspan="3" class="slds-text-align_center1">Summary</td>

													<td class="slds-text-align_right">
														<lightning-formatted-number value={totalyearlyaspiration}>
														</lightning-formatted-number>
													</td>
													<td class="slds-text-align_right">

													<td class={getClassForAspirationAttainment}>

													</td>
												</tr>
											</table>
										</div>
									</div>
								</lightning-tab>
							</template>
						</lightning-tabset>
					</lightning-tab>
