<!-- sldsValidatorIgnore -->
<template>
    <div class="exampleHolder" if:true={spinnerFlag}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </div>
    <lightning-card>
        <header class="modal-header slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse cancelReportCls" title="Close" onclick={handleCancel}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
            </button>
            <h1 class="slds-text-heading_medium">Report An Issue</h1>
        </header>
        <div class="slds-var-m-around_medium">
            <span class="slds-text-body_regular">Error Description</span>
            <lightning-textarea name="Error Description" required placeholder="Please provide a brief description of the issue along with any steps needed to simulate them; you can also upload screenshot of the issue" label="Description" onchange={onDescriptionChange} maxlength="2000" message-when-too-long="A maximum of 2000 characters are allowed." message-when-value-missing="An empty description cannot be posted."></lightning-textarea>
            <lightning-input type="file" accept=".xlsx, .xls, .csv, .png, .doc, .docx, .pdf, .jpg, .jpeg" label="Attachment" onchange={openfileUpload}></lightning-input>
            <template if:true={fileData}>
                <p>{fileData.filename}</p>
            </template>
        </div>
        <footer class="slds-modal__footer">
            <lightning-button label="Cancel" title="Submit" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
            <lightning-button variant="brand" label="Submit" title="Submit" onclick={handleSubmit} class="slds-m-left_x-small"></lightning-button>
        </footer>
    </lightning-card>
</template>
