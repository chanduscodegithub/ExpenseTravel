<template>
	<div class="container">
		<!----Timer Component--->
		<div class="timer">
			<div class="width">
				<article class="slds-card">
					<div class="slds-card__header slds-grid">
						<header class="slds-media slds-media_center slds-has-flexi-truncate">
							<div class="slds-media__figure">
								<span class="" title="Web Check In">
<lightning-icon icon-name="action:update_status" size="xx-small"></lightning-icon>
<span class="slds-assistive-text">Web Check In</span>
								</span>
							</div>
							<div class="slds-media__body bold">
								<h2 class="slds-text-heading_medium boldFont slds-m-bottom_medium">Web Check In</h2>

							</div>
							<div>
								<lightning-button-icon icon-name="action:refresh" onclick={handleRefreshView}
									alternative-text="refresh the timer" title="refresh the timer">
								</lightning-button-icon>
							</div>
						</header>
					</div>
				</article>
			</div>

			<div class="clock-containerNew">
				<div class="bgColor">

				</div>&nbsp;&nbsp;&nbsp;
				<p class="clock-daynew clock-timer">
					{currentDayNameAbbreviation}
				</p>
				<p class="clock-daynew2 clock-timer">
					{currentDay}&nbsp;&nbsp;{currentTime}

				</p>

			</div>
			<div class="clock-container">

				<div class="slds-p-bottom_x-large slds-m-right_large">
					<template if:true={checkInFlag}>
						<button class="slds-button slds-button_success button-color slds-p-right_x-small widthAdjust" onclick={handlePopupConfirm} disabled={disableWfa}>
		<template if:true={spinner}>
<lightning-icon icon-name="utility:spinner" alternative-text="clock" title="" class="slds-button__icon_left icon-color icon-rotate" size="x-small"></lightning-icon>
		</template>
		Check-In&nbsp;&nbsp;&nbsp;&nbsp;			
<lightning-icon icon-name="utility:clock" alternative-text="clock" title="" class="slds-button__icon_right slds-p-around_none slds-m-around_none slds-m-left_small slds-p-left_x-large icon-color" size="x-small"></lightning-icon>
	</button>
					</template>
					<template if:false={checkInFlag}>
						<button class="slds-button slds-button_destructive slds-p-right_x-small widthAdjust" onclick={handlePopupConfirm} disabled={disableWfa}>
				<template if:true={spinner}>
<lightning-icon icon-name="utility:spinner" alternative-text="clock" title="" class="slds-button__icon_left icon-color icon-rotate" size="x-small"></lightning-icon>
		</template>
		Check-Out&nbsp;		
<lightning-icon icon-name="utility:clock" alternative-text="clock" title="" class="slds-button__icon_right slds-p-around_none slds-m-around_none slds-m-left_small slds-p-left_x-large icon-color" size="x-small"></lightning-icon>
	</button>
					</template>
				</div><br/>

				<!--<div class="clock-col">
			<p class="clock-day clock-timer">
				{currentDayNameAbbreviation}
			</p>
			<p class="clock-label">
				Day
			</p>
		</div>
		<span class="colon-jack">:</span>-->
				<div class="clock-col">
					<p class="clock-hours clock-timer1">
						{curhour}
					</p>
					<p class="clock-label">
						Hours
					</p>
				</div>
				<span class="colon-jack">:</span>
				<div class="clock-col">
					<p class="clock-minutes clock-timer1">
						{curmin}
					</p>
					<p class="clock-label">
						Minutes
					</p>
				</div>
				<span class="colon-jack">:</span>
				<div class="clock-col">
					<p class="clock-seconds clock-timer1">
						{cursec}
					</p>
					<p class="clock-label">
						Seconds
					</p>
				</div>
			</div>

		</div>

		<!---popup Emp start------>
		<template if:true={isModalOpenConfirm}>
			<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
				aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<header class="slds-modal__header">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
					<lightning-icon icon-name="utility:close"
						alternative-text="close"
						variant="inverse"
						size="small" ></lightning-icon>
					<span class="slds-assistive-text">Close</span>
				</button>

						<template if:true={checkInFlag}>
							<h2 id="modal-heading-04" class="slds-text-heading_medium slds-hyphenate displayText">
								Check-In Confirmation
							</h2>
						</template>
						<template if:false={checkInFlag}>
							<h2 id="modal-heading-05" class="slds-text-heading_medium slds-hyphenate">
								<abbr class="slds-required" title="required">Check-Out Confirmation</abbr>
							</h2>
						</template>

					</header>
					<template if:true={checkInFlag}>
						<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
							Are you checking in please confirm..?
						</div>
					</template>
					<template if:false={checkInFlag}>
						<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
							Are you checking out please confirm..?
						</div>
					</template>

					<footer class="slds-modal__footer">
						<button class="slds-button slds-button_neutral" onclick={handleCheckInOut}>Confirm</button>
						<button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
					</footer>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</template>
		<!---popup Emp end------>

		<div class="emp-Search">
			<!----Employee Search Component--->

			<lightning-card variant="Narrow" title="" icon-name="standard:people">
				<div slot="title">
					<div class="slds-media__body bold">
						<h2 class="slds-text-heading_medium boldFont slds-m-bottom_medium">Search Employee</h2>
					</div>
				</div>
				<lightning-input type="search" value={searchResult} data-source="searchInputField"
					onchange={handleEmployeeSearch} is-loading={isSearchLoading} variant="label-hidden"
					placeholder="Search Your Colleagues" class="slds-p-horizontal_small">
				</lightning-input>
				<template if:true={empList}>
					<div style="margin-top:0px" id="listbox-id-5"
						class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">

						<ul class="slds-listbox slds-listbox_vertical" role="presentation">

							<template for:each={empList} for:item="obj" for:index="index">
								<li key={obj.Id} role="presentation" class="slds-listbox__item">
									<div data-recid={index} onclick={handelSelectedRecord}
										class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
										role="option">
										<span style="pointer-events: none;" class="slds-media__figure slds-listbox__option-icon" >
                      <span class="slds-icon_container" >
                          <lightning-icon icon-name="standard:people" size="small" alternative-text="icon" ></lightning-icon>  
                      </span>
										</span>
										<span style="pointer-events: none;" class="slds-media__body" >
                      <span  class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Name}  ({obj.EmployeeID__c})</span>
										</span>
									</div>
								</li>
							</template>

						</ul>

					</div>
				</template>
				<template if:true={isModalOpen}>
					<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
						aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
						<div class="slds-modal__container">
							<header class="slds-modal__header">
								<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
					<lightning-icon icon-name="utility:close"
						alternative-text="close"
						variant="inverse"
						size="small" ></lightning-icon>
					<span class="slds-assistive-text">Close</span>
				</button>
								<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Employee
									Detail

								</h2>
							</header>
							<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
								<c-view-employee-record record-id={selectedRecId} reportingmanager={reportingManager} costcentermanager={costcenterManager} empdesignation={empDesignation}></c-view-employee-record>
							</div>
						</div>
					</section>
					<div class="slds-backdrop slds-backdrop_open"></div>
				</template>

			</lightning-card>
		</div>
	</div>
</template>
