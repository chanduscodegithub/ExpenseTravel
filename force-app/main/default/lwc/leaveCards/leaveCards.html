<template>
<div class="leave__stats">
<!--Tile-->
<div class={casualClasses} data-type={casualBind} onclick={handleCardClick}>
  <div class="leave__logo">
    <img alt="Casual Leave Icon" src={casualLogo} />
  </div>
  <div class="leave__body">
    <div class="leave__heading">
      Casual Leave
    </div>
    <div class="leave__count">
      Total: <span class="nums">{casualLimit}</span>
    </div>
    <div class="leave__count">
      Remaining: <span class="nums">{casualBalance}</span>
    </div>
  </div>
</div>
<!--Tile-->
<div class={sickClasses} data-type={sickBind} onclick={handleCardClick}>

    </div>
  </div>
</div>
<!--Tile-->
<div class={paidClasses} data-type={paidBind} onclick={handleCardClick}>
      <lightning-icon icon-name="utility:info" alternative-text="Info" size="x-small" class="slds-icon slds-input__icon slds-input__icon_right slds-icon-text-default info__icon" data-message="Please reserve 5 days of paid leave for the year-end holiday."></lightning-icon>
<div class="leave__logo">
