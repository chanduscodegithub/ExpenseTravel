<template>
    <section class="slds-modal__content slds-p-around_medium slds-is-relative">
      <!-- Show the spinner if isLoading is true -->
      <template if:true={isLoading}>
        <div class="slds-align_absolute-center"  style="height: 200px;">
          <lightning-spinner variant="brand" size="medium"></lightning-spinner>
        </div>
      </template>
  
      <!-- Show the main content if isLoading is false -->
      <template if:false={isLoading}>
        <header class="slds-modal__header">
          <h2 id="modal-heading-01" class="slds-text-heading_medium">Confirmation</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
          <p style="text-align: center;">Are you sure you want to upload this file?</p>
        </div>
        <footer class="slds-modal__footer">
            <lightning-button variant="neutral" style="margin-left: 8px; padding-bottom: 8px;" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" style="margin-left: 8px; padding-bottom: 8px;" label="Confirm" onclick={handleConfirm}></lightning-button>
          </footer>
      </template>
    </section>
  </template>
